  <text x="20" y="26" font-size="14" font-weight="bold" fill="#1a1a2e">发包窗口（发到什么时候）与总预算（等多久）不是一回事</text>
  <text x="20" y="54" font-size="12" fill="#1565c0">直连：发包窗口 6 × 150ms = 900ms，之后只等不再发</text>
