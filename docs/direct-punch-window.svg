  <text x="620" y="218" font-size="11" fill="#607d8b" text-anchor="middle">3s</text>
  <text x="20" y="240" font-size="11" fill="#455a64">1s：C 的包到达 VPS（转发从此才可能发生）；等多久始终是总预算，窗口只管还发不发新的。</text>
  <text x="20" y="256" font-size="11" fill="#455a64">直连场景：对端 1s 才起好监听时窗口已过 → 只能干等到 3s，再退到 raceQUICDial 兜底。</text>
  <text x="20" y="272" font-size="11" fill="#455a64">中继场景：窗口给满 3s → 1.05s 那一发正好穿过去，正常拿到 pong、正常择优拨号，不惊动兜底。</text>
