<svg xmlns="http://www.w3.org/2000/svg" width="680" height="252" viewBox="0 0 680 252" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="252" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="bold" fill="#1a1a2e">The two credentials of a session: who generates them, who carries them, who uses them</text>
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/>
    </marker>
  </defs>
  <text x="40" y="50" font-size="12" font-weight="bold" fill="#1565c0">punch token (16 random bytes → 32 hex chars, one-shot, generated by A)</text>
  <rect x="40" y="60" width="170" height="48" rx="8" fill="#eaf6fb" stroke="#1565c0" stroke-width="1"/>
  <text x="125" y="79" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="middle" dominant-baseline="central">A (initiator)</text>
  <text x="125" y="95" font-size="11" fill="#1565c0" text-anchor="middle" dominant-baseline="central">generates it</text>
  <line x1="212" y1="84" x2="246" y2="84" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <rect x="250" y="60" width="180" height="48" rx="8" fill="#fff4e6" stroke="#b85c00" stroke-width="1"/>
  <text x="340" y="79" font-size="12" font-weight="bold" fill="#b85c00" text-anchor="middle" dominant-baseline="central">B signaling</text>
  <text x="340" y="95" font-size="11" fill="#b85c00" text-anchor="middle" dominant-baseline="central">passes it through only</text>
  <line x1="432" y1="84" x2="466" y2="84" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <rect x="470" y="60" width="170" height="48" rx="8" fill="#f3f5fa" stroke="#607d8b" stroke-width="1"/>
  <text x="555" y="79" font-size="12" font-weight="bold" fill="#455a64" text-anchor="middle" dominant-baseline="central">C and the VPS relay</text>
  <text x="555" y="95" font-size="11" fill="#607d8b" text-anchor="middle" dominant-baseline="central">use it as a lookup key</text>
  <text x="40" y="126" font-size="11" fill="#455a64">C looks it up to find the forward port; the VPS uses it as its relay binding and nudge key; the punch crypto session is derived from it too.</text>
  <text x="40" y="142" font-size="11" fill="#455a64">Do not confuse it with the nat relay udp uplink token: that one IS generated by B, is one-shot and dies once registered.</text>
  <text x="40" y="172" font-size="12" font-weight="bold" fill="#2e7d32">QUIC certificate fingerprint (sha256 of the self-signed DER, minted when C starts listening)</text>
  <rect x="470" y="182" width="170" height="48" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1"/>
  <text x="555" y="201" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle" dominant-baseline="central">C (target)</text>
  <text x="555" y="217" font-size="11" fill="#2e7d32" text-anchor="middle" dominant-baseline="central">mints the fingerprint</text>
  <line x1="468" y1="206" x2="434" y2="206" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <rect x="250" y="182" width="180" height="48" rx="8" fill="#fff4e6" stroke="#b85c00" stroke-width="1"/>
  <text x="340" y="201" font-size="12" font-weight="bold" fill="#b85c00" text-anchor="middle" dominant-baseline="central">B signaling</text>
  <text x="340" y="217" font-size="11" fill="#b85c00" text-anchor="middle" dominant-baseline="central">carries it in the offer</text>
  <line x1="248" y1="206" x2="214" y2="206" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <rect x="40" y="182" width="170" height="48" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1"/>
  <text x="125" y="201" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle" dominant-baseline="central">A (initiator)</text>
  <text x="125" y="217" font-size="11" fill="#2e7d32" text-anchor="middle" dominant-baseline="central">pins the TLS peer</text>
  <text x="40" y="246" font-size="11" fill="#455a64">In relay mode the VPS reports an empty fingerprint (it does not terminate TLS); A always pins C's, so the e2e certificate is A↔C and the VPS cannot impersonate C.</text>
</svg>
