<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="bold" fill="#1a1a2e">中继会话的信令时序：A 从第 3b 步就能开打，第 4~5 步与它并行</text>
  <rect x="64" y="40" width="96" height="30" rx="8" fill="#eaf6fb" stroke="#1565c0" stroke-width="1"/>
  <text x="112" y="55" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="middle" dominant-baseline="central">A 居民（发起）</text>
  <rect x="214" y="40" width="96" height="30" rx="8" fill="#fff4e6" stroke="#b85c00" stroke-width="1"/>
  <text x="262" y="55" font-size="12" font-weight="bold" fill="#b85c00" text-anchor="middle" dominant-baseline="central">B 信令服务</text>
  <rect x="364" y="40" width="96" height="30" rx="8" fill="#f3f5fa" stroke="#607d8b" stroke-width="1"/>
  <text x="412" y="55" font-size="12" font-weight="bold" fill="#455a64" text-anchor="middle" dominant-baseline="central">VPS 中继</text>
  <rect x="514" y="40" width="96" height="30" rx="8" fill="#eaf6fb" stroke="#1565c0" stroke-width="1"/>
  <text x="562" y="55" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="middle" dominant-baseline="central">C 居民（被连）</text>
  <line x1="112" y1="70" x2="112" y2="296" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="262" y1="70" x2="262" y2="296" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="412" y1="70" x2="412" y2="296" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="562" y1="70" x2="562" y2="296" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="112" y1="104" x2="256" y2="104" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="118" y="98" font-size="11" fill="#1565c0">1 d_request（候选 + token）</text>
  <line x1="262" y1="138" x2="406" y2="138" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="268" y="132" font-size="11" fill="#1565c0">2 d_relay_open：开中继 socket、拿到 E</text>
  <line x1="408" y1="172" x2="266" y2="172" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="404" y="166" font-size="11" fill="#1565c0" text-anchor="end">3 d_ready：E（公网 IP + 端口）</text>
  <line x1="262" y1="200" x2="116" y2="200" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="118" y="194" font-size="11" fill="#2e7d32">3b d_offer（半截，只有 E）→ A 立刻开打</text>
  <line x1="262" y1="228" x2="556" y2="228" stroke="#b85c00" stroke-width="1.5" marker-end="url(#arrOrange)"/>
  <text x="268" y="222" font-size="11" fill="#b85c00">4 d_punch（打洞目标就是 E）</text>
  <line x1="558" y1="256" x2="266" y2="256" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="554" y="250" font-size="11" fill="#1565c0" text-anchor="end">5 d_ready：候选 + 证书指纹</text>
  <line x1="262" y1="284" x2="116" y2="284" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="256" y="278" font-size="11" fill="#2e7d32" text-anchor="end">6 d_offer（完整）：指纹到齐 → 择路拨号</text>
  <path d="M592,214 L592,270" fill="none" stroke="#2e7d32" stroke-width="1"/>
  <path d="M592,214 L586,222" fill="none" stroke="#2e7d32" stroke-width="1"/>
  <path d="M592,270 L586,262" fill="none" stroke="#2e7d32" stroke-width="1"/>
  <text x="598" y="236" font-size="11" fill="#2e7d32">与 A 的</text>
  <text x="598" y="250" font-size="11" fill="#2e7d32">打洞并行</text>
  <text x="20" y="312" font-size="11" fill="#607d8b">第 4~5 步无法提前：C 的打洞目标由 E 决定。绿色两步是本次新增的两段式 offer（DirectRequest.TwoPhase / DirectOffer.EndpointOnly）。</text>
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85c00"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/>
    </marker>
  </defs>
</svg>
