<svg xmlns="http://www.w3.org/2000/svg" width="680" height="252" viewBox="0 0 680 252" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect x="0" y="0" width="680" height="252" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="bold" fill="#1a1a2e">一次会话的两份凭据：谁生成、经谁传递、给谁用</text>
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/>
    </marker>
  </defs>
  <text x="40" y="50" font-size="12" font-weight="bold" fill="#1565c0">打洞 token（16 字节随机 → 32 位 hex，一次性，A 生成）</text>
  <rect x="40" y="60" width="170" height="48" rx="8" fill="#eaf6fb" stroke="#1565c0" stroke-width="1"/>
  <text x="125" y="79" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="middle" dominant-baseline="central">A 发起方</text>
  <text x="125" y="95" font-size="11" fill="#1565c0" text-anchor="middle" dominant-baseline="central">生成 token</text>
  <line x1="212" y1="84" x2="246" y2="84" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <rect x="250" y="60" width="180" height="48" rx="8" fill="#fff4e6" stroke="#b85c00" stroke-width="1"/>
  <text x="340" y="79" font-size="12" font-weight="bold" fill="#b85c00" text-anchor="middle" dominant-baseline="central">B 信令服务</text>
  <text x="340" y="95" font-size="11" fill="#b85c00" text-anchor="middle" dominant-baseline="central">只透传，不生成也不改</text>
  <line x1="432" y1="84" x2="466" y2="84" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <rect x="470" y="60" width="170" height="48" rx="8" fill="#f3f5fa" stroke="#607d8b" stroke-width="1"/>
  <text x="555" y="79" font-size="12" font-weight="bold" fill="#455a64" text-anchor="middle" dominant-baseline="central">C 与 VPS 中继</text>
  <text x="555" y="95" font-size="11" fill="#607d8b" text-anchor="middle" dominant-baseline="central">拿它当查表键</text>
  <text x="40" y="126" font-size="11" fill="#455a64">C 用它查凭证表得到转发端口；VPS 用它当 relay binding 与 nudge 的关联键；双方派生的打洞加密会话也以它为键。</text>
  <text x="40" y="142" font-size="11" fill="#455a64">另一套容易混淆的 token：nat relay udp 的上行注册 token 由 B 生成，一次性、注册完即作废，与本图的 token 无关。</text>
  <text x="40" y="172" font-size="12" font-weight="bold" fill="#2e7d32">QUIC 证书指纹（sha256(自签证书 DER)，C 起监听时现场生成）</text>
  <rect x="470" y="182" width="170" height="48" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1"/>
  <text x="555" y="201" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle" dominant-baseline="central">C 被连方</text>
  <text x="555" y="217" font-size="11" fill="#2e7d32" text-anchor="middle" dominant-baseline="central">生成指纹</text>
  <line x1="468" y1="206" x2="434" y2="206" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <rect x="250" y="182" width="180" height="48" rx="8" fill="#fff4e6" stroke="#b85c00" stroke-width="1"/>
  <text x="340" y="201" font-size="12" font-weight="bold" fill="#b85c00" text-anchor="middle" dominant-baseline="central">B 信令服务</text>
  <text x="340" y="217" font-size="11" fill="#b85c00" text-anchor="middle" dominant-baseline="central">塞进 offer 透传</text>
  <line x1="248" y1="206" x2="214" y2="206" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <rect x="40" y="182" width="170" height="48" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1"/>
  <text x="125" y="201" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle" dominant-baseline="central">A 发起方</text>
  <text x="125" y="217" font-size="11" fill="#2e7d32" text-anchor="middle" dominant-baseline="central">固定 TLS 校验</text>
  <text x="40" y="246" font-size="11" fill="#455a64">中继模式下 VPS 报回的指纹为空（它不终结 TLS），A 拿到的始终是 C 的指纹：e2e 证书是 A↔C 的，VPS 冒充不了 C。</text>
</svg>
