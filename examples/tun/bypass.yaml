listen: 3001
watcher: true
default:
  dns: remote
  target: remote
  tcpTarget: remote
  match: equal

# 同机双实例逃逸: 仅 Linux 支持(macOS/Windows 已移除 bypass 模式)
mode: bypass
bypassLinux:
  # 自动探测不到物理网卡时(启动日志 bypass-only: device="")手动指定
  device: eth0

# 域名
hosts:
  - name: 126.com
    match: contain
    target: local
