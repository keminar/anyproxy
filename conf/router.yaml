# 监听端口IP, 优先级低于启动传参，不监听设置为off
listen:
# 日志目录
log:
  dir: ./logs/
# 监听配置文件变化  
watcher: true
# anyproxy 和 tunnel通信密钥, 必须16位长度
token: anyproxyproxyany
# 可访问的客户端IP，为空不限制
allowIP:
# 支持CIDR
#  - 172.17.0.12

# http非CONNECT请求首行域名处理
firstLine:
  #是否带Host, on带，off不带，默认带
  host: on
  #按域名配带Host，on带，off不带,其他用默认
  #一般vue本地项目要把域名配置为off
  #注意：域名和端口中间的冒号改为点，如localhost:5173配置为localhost.5173
  custom:
    localhost.5173: off
    
# tcpcopy 端口转发的目标地址(配合 mode: tcpcopy)。开启后 hosts 域名代理不再生效,
# allowIP 仍有效。ip/port 为转发目标。(enable 为旧写法, 等价 mode: tcpcopy, 仍兼容)
tcpcopy:
#  ip: 127.0.0.1
#  port: 3306

# 运行模式, 优先级低于启动传参 -mode。各取值互斥(单一取值天然互斥)
#   proxy   : 客户端/代理模式(默认, 留空即此)
#   tunnel  : 服务端 tunneld, 带 token 验证, 只处理 anyproxy 请求
#   tun     : 建TUN虚拟网卡做全局代理(需管理员/root; windows 用 WinDivert, 需 WinDivert.dll/.sys)
#   bypass  : 不建网卡, 仅把出向连接绑定物理网卡绕行(仅 Linux 支持)
#             用于本机已有另一个 anyproxy TUN 进程时, 让本进程 target=local 的请求
#             逃出对方 TUN 的 0/1 路由, 避免被再次劫持成死循环
#             macOS/Windows 已移除该模式: macOS 入站回包用 tun.inboundPorts,
#             Windows 用 WinDivert 的 tun.windows.excludeProcs/bypassIPs
#   tcpcopy : 端口转发, 每个连接改投到上面 tcpcopy.ip:port
mode:

# mode=tun 时生效: TUN虚拟网卡全局代理
# 启用后被路由到网卡的TCP流量会走 default/hosts 的代理规则
#
# 推荐「按系统分块」写法: tun.linux / tun.darwin / tun.windows 各只填本系统用得到的
# 字段, 程序按当前系统取对应块。这样每块里不会出现"本平台无效"的字段, 一目了然。
# 程序按当前系统取对应块的整组配置。
tun:
#  # ===== Linux (gVisor 虚拟网卡) =====
#  linux:
#    name: anytun0            # 网卡名, 默认 anytun0
#    addr: 10.9.0.1/24        # 接口地址CIDR
#    mtu: 1500
#    autoRoute: true          # 默认 true 自动加路由; false 只打印命令
#    blockQUIC: true          # 默认 true: drop 命中hosts(配ip)域名的UDP443, 逼QUIC回退TCP
#    bypassIPs:               # 这些目标直连(自动加 /32 路由), 填上级代理/VPN服务器IP
#      - 192.168.199.1
#    # 说明: 外网SSH等入站服务的回包由内置源策略路由(ip rule)自动放行, 无需配置。
#    # 下面两项仅 mode=bypass(物理网卡绕行, 不建TUN网卡)时生效, 与 mode=tun 互斥:
#    excludeNics:             # 采集直连子网时排除的网卡名(通常填另一进程的TUN网卡名)
#      - anytun0
#    device:                  # 手动指定物理网卡名, 留空则自动探测默认路由网卡
#      # eth0
#
#  # ===== macOS (gVisor utun) =====
#  darwin:
#    addr: 10.9.0.1/24
#    autoRoute: true
#    blockQUIC: true
#    bypassIPs:
#      - 192.168.199.1
#    inboundPorts:            # 需放行回包的入站TCP端口(如外网SSH 22), 用 pf reply-to; 需 root
#      - 22
#
#  # ===== Windows (WinDivert 重定向, 无虚拟网卡) =====
#  windows:
#    blockQUIC: true
#    windivertDir: C:\wd     # WinDivert.dll+WinDivert64.sys 所在目录; 空=exe同目录。
#                            # 可把驱动放到无空格/中文的干净路径, exe 原地不动, 绕开驱动加载失败
#    bypassIPs:               # 这些目标"排除捕获"直连, 填上级代理/VPN服务器IP
#      - 203.0.113.10
#    excludeProcs:            # 这些进程的出向一律不重定向(逃 OpenVPN 等同机隧道死循环)
#      - openvpn.exe

# 死循环兜底熔断器(不仅仅应用于全局代理，经过anyproxy的死循环都有效)。
# 同机 A(mode=tun)+B(mode=bypass, 仅Linux) 部署时, 正常应由 bypass 从路由层根治环路;
# 若 bypass 未生效, 句柄会堆积且都指向同一目标。判定: 全局在传连接数达到 minActive
# (闸门)后, 若某个 host:port 占用的在传连接超过 total*ratio%, 判为环路并拒绝其新连接。
# 常态(总连接数低于闸门)只做一次 int 比较, 无额外开销。
# 注意: 环路会在总连接数刚过 minActive 时被切断, 每条连接约占 2 个文件描述符,
#       故 minActive*2 必须远小于 ulimit -n(anyproxy 建议 ulimit -n 65535), 否则进程会
#       先撞 too many open files, 熔断器来不及触发。低 ulimit 环境请调小 minActive。
loopGuard:
#  # 全局在传连接数达到此值才启用占比检查; 0=用内置默认(1000,默认开启); <0=关闭
#  minActive: 1000
#  # 单目标占全局在传连接的百分比阈值(如80=80%); <=0 用默认80
#  ratio: 80

# geoip/geosite 数据集, 配了才启用 hosts 的 geoip:/geosite: 匹配(见下面 hosts 说明)。
# 只负责「加载数据」: 加载哪些类别在这里, 命中后干什么(target/dns/proxy)仍写在 hosts,
# 由 hosts 里 geoip:xx / geosite:xx 规则的摆放位置决定优先级(保持排序灵活)。
#
# 顶层 geoip: / geosite:, 每项一个文件, 一个文件可含多类别、只解析一次。
# 文件按扩展名区分:
#   .dat : protobuf 数据集(一个文件多类别)。cats 列出要用的类别; cats 留空=加载文件内全部类别。
#   其它 : 纯文本列表(整个文件即一个类别), cats 须恰好给一个类别名。geoip 每行 CIDR/IP;
#          geosite 每行域名, 支持 full:/domain:/keyword:/regexp: 前缀(无前缀默认 domain 后缀),
#          # 注释, keyword/regexp 当国外丢弃。如域名列表 direct-list.txt。
# 同一类别可由多个文件合并取并集(重复项去重): 如上面 geosite.dat 的 cn 与 direct-list.txt(整文件=cn)
# 都加载后, hosts 里 geosite:cn 命中两者内容之和。按列表顺序逐项合并, 类名大小写不敏感(cn=CN);
# 某项加载失败(如 .dat 无该类别)只打日志提示、不中断启动, 该项内容不生效。
# .dat 可先用命令离线提取所需类别成小文件随发布携带(运行时只读小文件):
#   anyproxy -geo-extract -geo-in geosite.dat -geo-cat cn,google -geo-out geosite-cn.dat
#geoip:
#  - file: ./geoip.dat          # .dat 一个文件多类别, 只解析一次
#    cats: [cn, us]             # 要用的类别; 留空则加载该 .dat 内全部类别
#  - file: ./cloudflare.txt     # 文本 CIDR 列表, 整文件即一个类别
#    cats: [cloudflare]         # 文本列表必须恰好一个类别名
#geosite:
#  - file: ./geosite.dat
#    cats: [google, cn]
#  - file: ./direct-list.txt    # 文本域名列表(整文件=cn)
#    cats: [cn]

# 默认操作，可热加载
default:
  # 使用的DNS服务器 local 当前环境， remote远程, 仅当target使用remote有效
  dns: local
  # 默认环境，local 当前环境, remote 远程, deny 禁止
  # auto根据dial选择，local dial失败则remote
  target: auto
  # tcp 请求环境，local 当前环境, remote 远程, deny 禁止
  # localport 按端口分流：命中端口走本地直连，其余走代理(remote)
  tcpTarget: remote
  # tcpTarget=localport 时生效：这些端口走本地直连、其余走代理
  # 不配置则默认 21(ftp)/22(ssh) 走本地；一旦配置则完全以此为准(覆盖默认)
  #localPort:
  #  - 22
  #  - 21
  #  - 3306
  # 默认域名比对方案(仅当 name 无星号且未显式配 match 时生效): contain 包含, equal 完全相等
  match: equal
  # 全局代理服务器, 优先级低于启动传参 -p。
  # 与单域名 proxy 一样支持: 逗号分隔多代理(依次取第一个能连通的) + 末尾 local/deny 后缀
  # (全部代理都连不通时: local 走本地直连, deny 拒绝)。例:
  #   proxy: http://127.0.0.1:8888, http://127.0.0.1:7777 local
  proxy:
  # 黑洞哨兵IP, 不配默认 192.0.0.0; 设 off/none/disable 关闭。
  # 用法: 把域名指向它, 如系统 hosts 写 `192.0.0.0 example.com`。达成两个效果:
  #   ① 没开代理时: 192.0.0.0 不可路由, 本机连它必然失败 = 天然屏蔽该域名。
  #   ② 开了 tun/WinDivert 代理(未设系统代理)时: 命中该 IP 的连接被强制拦截进引擎,
  #      并强制按 target=remote + dns=remote 处理 —— 不直连哨兵, 而是从 SNI 取域名交下级
  #      代理远程解析真实 IP 连出, 于是该域名经代理可正常访问。
  # windows WinDivert 下该 IP 强制进引擎(不受 tun.windows.bypassPrivate 影响)。
  # 注意: 哨兵必须用 192.0.0.0(不能用 127.0.0.1 或私网, 否则不进 TUN/引擎); ②依赖能嗅到
  # SNI/Host 域名(ECH 等嗅不到则拒绝), 且需有可用下级代理。专题详见 docs/blackhole-sentinel.md。
  #blackholeIP: 192.0.0.0

# 域名，可热加载
# name 支持首/尾 * 通配，无需再配 match(去掉星号的部分记为 X)：
#   name: google.com     精确匹配      → 仅 google.com
#   name: "*google.com"  末尾一致(后缀) → www.google.com 命中，www.google.com.hk 不命中
#   name: "google.com*"  开头一致(前缀) → google.com/google.com.hk 命中，www.google.com 不命中
#   name: "*google.com*" 子串包含       → 含 google.com 的任意位置都命中
# yaml 中以 * 开头的值需加引号；显式配 match 时仍以 match 为准(兼容旧配置)
# name 还支持 geoip:xx / geosite:xx 按 geo 数据集匹配(需配上面的顶层 geoip: / geosite:):
#   - name: geoip:cn      # 目标 IP 命中 geoip 类别 cn → target 生效(如 local 直连)
#     target: local
#   - name: geosite:cn    # 目标域名命中 geosite 类别 cn → target 生效
#     target: local
hosts:
  - name: "*github*"
    # 参考全局target
    # 如果有用proxy自定义代理可用，target强制当remote使用，proxy代理不可用，target按原逻辑处理
    target: remote
    # 参考全局localDns 
    dns: remote
    # 支持 http:// , tunnel:// , socks5:// 三种协议，默认 tunnel://
    #proxy:  http://127.0.0.1:8888
    # 支持多代理，支持忽略全局代理并执行 local 或 deny 2种逻辑
    proxy: http://127.0.0.1:8888, http://127.0.0.1:7777 local
  - name: "*golang.org"
    target: auto
    dns: remote
  - name: www.baidu.com
    target: auto
  # 旧写法(显式 match)仍兼容
  - name: google
    match: contain
    target: deny
  - name: dev.example.com
    ip: 127.0.0.1
    port:
      - from: 80
        to: 88
    allowIP:
     # - 172.17.0.12
  # 黑洞哨兵用法(配置 hosts 版, 对 DoH 客户端也生效): 把域名 ip 指到 default.blackholeIP。
  # 效果同系统 hosts 写 192.0.0.0, 但因走 DNS 层劫持, DoH/系统解析都拿到哨兵 IP;
  # 命中后强制 remote+remote 经下级代理远程解析访问, 无代理时不可达=屏蔽。
  #- name: blocked-but-proxyable.com
  #  ip: 192.0.0.0

#websocket 配置, 按角色分 server(服务端) / client(客户端) 两块
#  server: 需配 listen, users 才起服务
#  client: 未配 connect / user / email 则不发起连接; 要同时订阅多台 server 用 clients(数组)代替, 见下方注释
websocket:
  # ===== 服务端(tunnel侧) =====
  server:
    # 监听端口
    listen:
    # 鉴权账号数组(校验接入的订阅方), 每条 user/pass/disable; disable: true 可临时停用某个账号
    users:
      # - user:
      #   pass:
      #   disable: false
    # 可接入来源IP白名单(CIDR/单IP)，为空不限制；按真实TCP来源判定，loopback 始终放行
    # 同时约束: websocket 订阅方接入 与 下面 forward 裸TCP转发入口(listen)的来源
    allowIP:
    #  - 172.17.0.0/16
    # 裸TCP端口转发入口(内网穿透): 在 listen 端口收连接, 经 websocket 转给该 email 的订阅方
    forward:
      # - listen: ":2222"
      #   email: someone@example.com
  # ===== 客户端(proxy侧) =====
  client:
    # ip 端口
    connect:
    # connect 域名(Host头)
    host:
    # 用户名(发给服务端)
    user:
    # 密码
    pass:
    # Email用于定位用户，不鉴权
    email:
    # 订阅头部信息
    subscribe:
      - key:
        val:
    # 裸TCP端口转发目标: 收到服务端 port 入口来的连接时, dial 写死的 target
    # 直连(direct)落地也复用这张表: 未在此映射的 port 一律拒绝
    forward:
      # - port: 2222
      #   target: 127.0.0.1:22
    # ===== IPv6 QUIC 直连(数据不经服务端, 详见 docs/websocket.md 路径 C) =====
    # 允许别的订阅方直连本机(监听按需起, 平时不占端口); 落地目标仍受上面 forward 白名单约束
    directAccept: false
    # 本机直连入口: 在 listen 起监听, 连接直接送给 email 对应的订阅方, 由对方按 port 查它的 forward
    # protocol: tcp(默认) / udp / both; both 适合 RDP(主通道 TCP 3389 + Enhanced RDP 的 UDP 3389)
    direct:
      # - listen: ":13389"
      #   email: someone@example.com
      #   port: 3389
      #   protocol: both
  # 同时订阅多台 server: 配了 clients 就只用 clients(上面单个 client 块被忽略), 每项是完整独立配置,
  # 字段同上面 client 块(connect/host/user/pass/email/subscribe/forward/directAccept/direct)
  # clients:
  #   - connect:
  #     user:
  #     pass:
  #     email:
  #     forward:
  #       - port: 2222
  #         target: 127.0.0.1:22
  #   - connect:
  #     user:
  #     pass:
  #     email:
  #     forward:
  #       - port: 2222
  #         target: 192.168.1.10:3389
